services:
  moderation-bot:
    image: ghcr.io/focalorrr/roblox-moderation-bot:latest
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
